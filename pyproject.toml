[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-rag"
version = "0.1.0"
description = "Vehicle knowledge-base RAG QA system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.24",
  "pymupdf>=1.23",
  "python-docx>=1.1",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]
faiss = ["faiss-cpu>=1.8"]
bge = ["FlagEmbedding>=1.2"]
redis = ["redis>=5.0"]
mysql = ["sqlalchemy>=2.0", "aiomysql>=0.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

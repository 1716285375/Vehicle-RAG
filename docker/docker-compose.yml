services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8001:8001"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      REDIS_URL: redis://redis:6379/0
      MYSQL_DSN: mysql+aiomysql://vehicle:vehicle@mysql:3306/vehicle_rag
      VECTOR_STORE: json
      INDEX_PATH: /app/data/processed/vector_index.json
      SESSION_STORE_PATH: /app/data/processed/sessions.json
    volumes:
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vehicle_rag
      MYSQL_USER: vehicle
      MYSQL_PASSWORD: vehicle
      MYSQL_ROOT_PASSWORD: vehicle_root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uvehicle", "-pvehicle"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.15
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    profiles: ["milvus"]
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    profiles: ["milvus"]
    command: ["minio", "server", "/minio_data"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data

volumes:
  redis-data:
  mysql-data:
  milvus-data:
  etcd-data:
  minio-data:
